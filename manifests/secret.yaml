apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-server.crt>
  tls.key: <base64-encoded-server.key>

# Note: Replace <base64-encoded-server.crt> and <base64-encoded-server.key> with the actual base64-encoded values of your server certificate and key.
# You can generate these values using the following commands:
#   - cat server.crt | base64 | tr -d '\n'
#   - cat server.key | base64 | tr -d '\n'
# Make sure to keep the indentation and formatting consistent with the rest of the YAML file.
# This secret will be used by the webhook deployment to mount the TLS certificate and key for secure communication.
# The secret type is set to kubernetes.io/tls, which is the standard type for storing TLS certificates and keys in Kubernetes.
# The secret will be mounted as a volume in the webhook deployment, allowing the webhook server to use the TLS certificate and key for secure communication with the Kubernetes API server.